        }
        /**
         * 阶段 2 的一步：网络是第 0 方，机器人（见 bot）是第 1 方，双方用 play 同时行动。规则和对战不同：
         * - 打掉机器人的基地才算赢。
         * - 网络的坦克被击中，或者网络的基地被毁，就输。
         * - 机器人的坦克被击中时，它从场上消失，回合继续。
         * - 走满回合步数还没有赢，也算输。所以没有平局。
         * State.end：-1 进行中，0 赢，1 输。
         * @param state 对战的状态
         * @param action 网络的动作
         * @returns 下一步的状态
         */
        export function duelStep(state, action) {
          const b = state.tanks[1].on ? bot(state, 1) : 5;
          const next = play(state, action, b < 4 ? (b + 2) % 4 : b);
          const lost = !next.tanks[0].on || !next.bases[0];
          const end = lost ? 1 : !next.bases[1] ? 0 : next.t >= params.steps ? 1 : -1;
          return { state: { ...next, end }, done: end >= 0, success: end === 0 };
        }
        /**
         * 阶段 2 的奖励：打掉机器人的基地得 duel.winReward，输得 duel.loseReward。机器人的坦克被击中得 duel.killReward。
         * 每一步还减 duel.stepCost，所以赢得越快越好。击毁坦克只是手段，所以 killReward 比 winReward 小。
         * @param transition 这一步的转移
         * @returns 这一步的奖励
         */
        export function duelReward(transition) {
          const end = transition.next.end;
          const killed = transition.prev.tanks[1].on && !transition.next.tanks[1].on ? duel.killReward : 0;
          return (end === 0 ? duel.winReward : end === 1 ? duel.loseReward : 0) + killed - duel.stepCost;
        }
  clearRate:
    kind: code
    title: 过关率
    config:
      source: |-
        /**
         * 击毁全部敌人为 1，否则为 0。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function clearRate(episode) {
          return episode.final.end === 0 ? 1 : 0;
        }
  killCount:
    kind: code
    title: 平均击毁数
    config:
      source: |-
        /**
         * 这一局击毁的敌人数。评估器对各局取平均。
         * @param episode 回合摘要
         * @returns 击毁数
         */
        export function killCount(episode) {
          return episode.final.kills;
        }
  baseKept:
    kind: code
    title: 基地保住的比例
    config:
      source: |-
        /**
         * 基地没有被毁为 1，否则为 0。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function baseKept(episode) {
          return episode.final.end === 2 ? 0 : 1;
        }
  agreeRate:
    kind: code
    title: 和教师一致的比例
    config:
      source: |-
        /**
         * 我方的动作在教师的目标位里的步数，除以回合的步数。阶段 2 的 gate 读它。
         * @param episode 回合摘要
         * @returns 0 到 1
         */
        export function agreeRate(episode) {
          return episode.final.t > 0 ? episode.final.agree / episode.final.t : 0;
        }
  winRate:
    kind: code
    title: 胜率
    config:
      source: |-
        /**
         * 阶段 2：网络打掉了机器人的基地为 1，否则为 0。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function winRate(episode) {
          return episode.final.end === 0 ? 1 : 0;
        }
  killRate:
    kind: code
    title: 击毁对方坦克的比例
    config:
      source: |-
        /**
         * 阶段 2：机器人的坦克在这一局被击中为 1，否则为 0。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function killRate(episode) {
          return episode.final.tanks[1].on ? 0 : 1;
        }
  hitRate:
    kind: code
    title: 我方坦克被击中的比例
    config:
      source: |-
        /**
         * 阶段 2：网络的坦克被击中为 1，否则为 0。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function hitRate(episode) {
          return episode.final.tanks[0].on ? 0 : 1;
        }
  timeoutRate:
    kind: code
    title: 超时的比例
    config:
      source: |-
        /**
         * 阶段 2：走满回合步数，网络的坦克和基地都还在，但是没有打掉机器人的基地，为 1，否则为 0。这也算输。
         * @param episode 回合摘要
         * @returns 0 或 1
         */
        export function timeoutRate(episode) {
          const s = episode.final;
          return s.end === 1 && s.tanks[0].on && s.bases[0] ? 1 : 0;
        }
  # 阶段 1 · 模仿：训练器用交叉熵学教师 teacher 的目标位。“中”和“大”各有一个训练模块，里面是一个训练器和它的回路。
  # 每个结构有自己的候选、评估器、执行实例和回放。读出、报告和回放的配置相同，所以用 YAML 锚点（&）共用。
  # 两个训练器的配置是按实测选的：“中”要更多轮和更大的学习率才能达到和教师一致的比例 0.9。exploration 0.1 比 0.25 好。
  # 模板按本地 id 的字母顺序保存。所以“中”的本地 id 用前缀 s1_a_，“大”用 s1_b_。
  s1_a_loop: { kind: loop, title: 回路（中） }
  s1_a_net:
    kind: network
    title: 中
    config: &mid { engine: dense-policy, kind: feedforward, inputs: 492, weightBits: 16, layers: [{ hidden: 32 }, { hidden: 32 }], ticks: 1, leak_shift: 0, reset: 0 }
  s1_a_readout: { kind: readout, title: 读出（中）, config: &readout { mode: argmax, map: [0, 1, 2, 3, 4, 5] } }
  s1_a_trainer:
    kind: trainer
    title: 训练器（中）
    config: { method: cross-entropy, epochs: 5000, lr: 0.005, replicas: 1, episodesPerEpoch: 16, calibrationEpisodes: 32, exploration: 0.1, evalEvery: 20, seed: 1, backend: browser }
  s1_a_cands: { kind: candidates, title: 候选（中） }
  s1_a_evaluator: { kind: evaluator, title: 评估器（中） }
  s1_a_report:
    kind: view
    title: 评估报告（中）
    config: &report { renderer: kv, path: report.metrics }
  s1_a_execution: { kind: execution, title: 执行实例（中） }
  s1_a_replay:
    kind: view
    title: 回放（中）
    config: &replay
      renderer: script
      script: |-
        // 回放：画地图（砖墙、钢墙、基地）、我方坦克、敌方坦克和飞行中的子弹。坦克是方块，三角形指向朝向。
        // 地图来自场景的状态 cells（第 y * 边长 + x 格：0 空地、1 砖墙、2 钢墙、3 基地），所以打掉的砖墙不再画出。
        // 阶段 2 的状态是对战的状态（有 tanks 和 bases）：我方是第 0 方，敌人是机器人（第 1 方），两个基地各画一个。
        // 图下面是图例、步数、我方的动作、击毁数和结果。
        // 执行实例走一步时，回放从上一步播到这一步（见下面的动画）。拖动回看滑条时，回放直接跳到选中的那一步，不播动画。
        /** 一格的边长（SVG 单位）。 */
        const CELL = 20;
        const ME = 'var(--inh, #5e8fe8)';
        const FOE = 'var(--bad, #f0684d)';
        const BRICK = 'var(--brick, #b4643c)';
        const DIR = ['上', '右', '下', '左'];
        const ACT = [...DIR, '开火', '等待'];
        const END = { 0: '过关', 1: '我方坦克被击中', 2: '基地被毁', 3: '步数用完' };
        const DUEL_END = { 0: '我方赢（打掉对方基地）', 1: '我方输' };

        // 动画（对战脚本的战场有同样的一段）：新的一步到达时，从上一帧播到这一帧。场景的 trails 给出每颗子弹的轨迹：
        // 出发格、方向、飞过的格数、最后到的格和停下的原因。子弹每步匀速飞 2 格。坦克按规则先行动，所以在前半步滑一格并转向。
        // 砖墙在子弹打到它时才消失。子弹停下的地方有一个短的效果：砖墙碎掉、钢墙上的火花、坦克或基地爆炸、两颗子弹相撞的闪光。
        // 一步的时长是最近几步到达间隔的平均，限制在 MIN 到 MAX 毫秒。间隔大于 MAX（例如单步）时，时长是 SINGLE。
        // 上一步还没有播完时新的一步到达，上一步在 FAST 毫秒内播完，然后播新的一步。所以显示会落后，但不跳过子弹。
        const MIN = 80;
        const MAX = 600;
        const SINGLE = 200;
        const FAST = 40;
        /** 时长取最近几个到达间隔的平均。 */
        const AVERAGE = 4;
        /** 一个效果持续的毫秒数。 */
        const LIFE = 300;
        const DX = [0, 1, 0, -1];
        const DY = [-1, 0, 1, 0];
        /** 停下的原因（轨迹的 why）的效果：1 砖墙碎掉，2 钢墙或地图边的火花，3 基地和 4 坦克爆炸，5 和 6 两颗子弹相撞的闪光。 */
        const EFFECT = [null, 'brick', 'spark', 'boom', 'boom', 'flash', 'flash'];

        /** 轨迹 r 的子弹停下时离出发格中心几格：打到墙、基地或互相穿过时停在两格的交界，打到坦克或在同一格相撞时停在格的中心。 */
        function reach(r) {
          return r.why === 1 || r.why === 2 || r.why === 3 || r.why === 6 ? r.n - 0.5 : r.n;
        }
        /** 轨迹 r 在一步里停下的时刻（0 到 1）。没有飞就被击中（n 是 0）时，是坦克开到子弹上，所以是坦克走完的半步。 */
        function when(r) {
          return r.why === 4 && r.n === 0 ? 0.5 : reach(r) / 2;
        }
        /** 轨迹 r 的子弹飞了 dist 格时的位置（格的坐标）。 */
        function along(r, dist) {
          return { x: r.x + DX[r.d] * dist, y: r.y + DY[r.d] * dist };
        }
        /** trails 里因为原因 why 停在 (x, y) 的最早时刻。没有这样的轨迹时是 Infinity。 */
        function hitAt(trails, why, x, y) {
          return Math.min(Infinity, ...trails.filter((r) => r.on && r.why === why && r.ex === x && r.ey === y).map(when));
        }
        /** 坦克在时刻 p 的位置和角度：前半步从 a 滑到 b，并朝近的一边转到 b 的朝向。 */
        function slide(a, b, p) {
          const q = Math.min(1, p * 2);
          const turn = ((b.d - a.d + 6) % 4) - 2;
          return { x: a.x + (b.x - a.x) * q, y: a.y + (b.y - a.y) * q, angle: (a.d + turn * q) * 90 };
        }
        /** 一个效果的 SVG 属性：age 从 0 到 1 时，它变大并淡出。 */
        function effect(e) {
          return { key: e.key, kind: e.kind, opacity: 1 - e.age, transform: `translate(${(e.x + 0.5) * CELL} ${(e.y + 0.5) * CELL}) scale(${0.6 + e.age})` };
        }
        /**
         * 播放器。play(steps) 排上新到达的几步（每步是 { from, to } 两个状态），jump(s) 不播动画，直接显示状态 s。
         * draw(from, to, p, effects) 是视图的画法，它画出时刻 p 的样子。播放器把结果放在 frame 里。
         */
        function player(draw) {
          const frame = Vue.shallowRef(null);
          const gaps = [];
          let last = -Infinity;
          let queue = [];
          let cur = null;
          let shown = null;
          let effects = [];
          let raf = 0;
          let serial = 0;
          /** 上一步播完的时刻。一步从它到达的时刻或者上一步播完的时刻开始（取晚的），所以画面的延迟不会累积。 */
          let free = -Infinity;
          /** count 步在时刻 now 一起到达时，每步的时长。 */
          function measure(now, count) {
            const gap = (now - last) / count;
            last = now;
            if (gap > MAX) {
              gaps.length = 0;
              return SINGLE;
            }
            gaps.push(gap);
            if (gaps.length > AVERAGE) gaps.shift();
            return Math.min(MAX, Math.max(MIN, gaps.reduce((a, b) => a + b, 0) / gaps.length));
          }
          /** 后面有步在等时，一步最多播几毫秒。等的步很多时，一步只播一帧。 */
          const hurry = () => (queue.length > 8 ? 16 : FAST);
          const progress = (now) => Math.min(1, cur.p0 + (1 - cur.p0) * Math.max(0, (now - cur.t0) / cur.span));
          const aged = (now) => effects.map((e) => effect({ ...e, age: (now - e.born) / LIFE }));
          function tick() {
            raf = 0;
            const now = performance.now();
            if (!cur && queue.length) {
              const next = queue.shift();
              cur = { ...next, p0: 0, t0: Math.max(next.at, free), span: queue.length ? hurry() : next.span, ended: [] };
            }
            effects = effects.filter((e) => now - e.born < LIFE);
            if (cur) {
              const step = cur;
              const p = progress(now);
              (step.to.trails ?? []).forEach((r, j) => {
                if (r.on && r.why > 0 && !step.ended[j] && when(r) <= p) {
                  step.ended[j] = true;
                  effects.push({ key: serial++, kind: EFFECT[r.why], ...along(r, reach(r)), born: now });
                }
              });
              if (p >= 1) {
                shown = step.to;
                free = step.t0 + step.span;
                cur = null;
              }
              frame.value = draw(step.from, step.to, p, aged(now));
            } else if (shown) frame.value = draw(shown, shown, 1, aged(now));
            if (cur || queue.length || effects.length) raf = requestAnimationFrame(tick);
          }
          function play(steps) {
            const now = performance.now();
            const span = measure(now, steps.length);
            queue.push(...steps.map((s) => ({ ...s, span, at: now })));
            if (cur && cur.t0 + cur.span - now > hurry()) Object.assign(cur, { p0: progress(now), t0: now, span: hurry() });
            if (!raf) raf = requestAnimationFrame(tick);
          }
          function jump(s) {
            queue = [];
            cur = null;
            effects = [];
            shown = s;
            frame.value = s ? draw(s, s, 1, []) : null;
          }
          return { frame, play, jump, stop: () => cancelAnimationFrame(raf) };
        }

        /** 关卡或对战在时刻 p 的样子：从状态 from 播到状态 to。对战的状态有 tanks：第 0 辆是我方，第 1 辆是唯一的敌人。 */
        function draw(from, to, p, effects) {
          const N = Math.round(Math.sqrt(to.cells.length));
          const trails = to.trails ?? [];
          const duel = !!to.tanks;
          const meOf = (s) => (duel ? s.tanks[0] : s.me);
          const foesOf = (s) => (duel ? [s.tanks[1]] : s.foes);
          // 被子弹打掉的砖墙画到子弹打到它的时刻
          const cells = to.cells.flatMap((v, c) => {
            const x = c % N;
            const y = Math.floor(c / N);
            const kind = from.cells[c] === 1 && v !== 1 && p < hitAt(trails, 1, x, y) ? 1 : v;
            return kind ? [{ key: c, v: kind, cx: x, cy: y, x: x * CELL, y: y * CELL }] : [];
          });
          // 关卡有一个基地。对战有两个：第 0 方的在下半张，第 1 方的在上半张。基地在子弹打到它时被毁。
          const bases = cells.filter((c) => c.v === 3).map((b) => {
            const k = duel && b.cy * 2 < N ? 1 : 0;
            const gone = duel ? !to.bases[k] && (!from.bases[k] || p >= hitAt(trails, 3, b.cx, b.cy)) : to.end === 2 && p >= hitAt(trails, 3, b.cx, b.cy);
            return { ...b, color: duel ? (k ? FOE : ME) : 'var(--ok, #4fbf7e)', lost: gone, label: `${duel ? (k ? '敌方' : '我方') : ''}基地${gone ? '（已被毁）' : ''}` };
          });
          const tank = (a, b, color, name, key) => {
            const at = slide(a, b, p);
            const hit = p >= hitAt(trails, 4, b.x, b.y);
            return { key, color, hit, transform: `translate(${(at.x + 0.5) * CELL} ${(at.y + 0.5) * CELL}) rotate(${at.angle})`,
              label: `${name} (${b.x}, ${b.y}) 朝${DIR[b.d]}${hit ? '，被击中' : ''}` };
          };
          // 敌人：被击毁的画到被打中的时刻。不是相邻格的两个位置是新出现的敌人，它不滑动。
          const foes = foesOf(to).flatMap((f, i) => {
            const was = foesOf(from)[i];
            const near = was.on && Math.abs(was.x - f.x) + Math.abs(was.y - f.y) <= 1;
            if (f.on) return [tank(near ? was : f, f, FOE, `敌人 ${i + 1}`, `foe${i}`)];
            return was.on && p < hitAt(trails, 4, f.x, f.y) ? [{ ...tank(was, f, FOE, `敌人 ${i + 1}`, `foe${i}`), hit: false }] : [];
          });
          const shots = trails.flatMap((r, i) => {
            if (!r.on || (r.why > 0 && p >= when(r))) return [];
            const at = along(r, Math.min(p * 2, reach(r)));
            return [{ key: i, color: i ? FOE : ME, cx: (at.x + 0.5) * CELL, cy: (at.y + 0.5) * CELL,
              label: `${i ? `敌人 ${i} 的` : '我方'}子弹，从 (${r.x}, ${r.y}) 向${DIR[r.d]}` }];
          });
          return {
            state: to,
            N,
            bricks: cells.filter((c) => c.v === 1),
            steel: cells.filter((c) => c.v === 2),
            bases,
            tanks: [tank(meOf(from), meOf(to), ME, '我方坦克', 'me'), ...foes],
            shots,
            effects,
          };
        }

        const component = {
          props: ['ctx'],
          setup(props) {
            const s = Vue.computed(() => props.ctx.state);
            const play = player(draw);
            /** 上一个 ctx 的状态，以及它是不是跟着执行实例（不是回看） */
            let latest = null;
            let live = false;
            // 跟着执行实例时，比上一个状态多 1 步就播这一步。多几步时（几步一起到达），从 history 里取出中间的状态，一步一步播。
            // 回看、重置、新的回合或者多出 64 步以上时，直接跳过去。
            Vue.watch(() => props.ctx, (ctx) => {
              const st = ctx?.state?.cells ? ctx.state : null;
              const gap = st && latest && live && ctx.live ? st.t - latest.t : -1;
              // 步数相同的 ctx 多半只是别的输出变了。状态也变了时（例如重置到另一个种子），直接跳过去。
              if (gap === 0 && JSON.stringify(st) === JSON.stringify(latest)) return;
              const steps = gap === 1 ? [st] : gap > 1 && gap <= 64 ? (ctx.history ?? []).map((h) => h.next).filter((n) => n && n.t > latest.t && n.t <= st.t) : [];
              if (gap >= 1 && steps.length === gap) play.play(steps.map((n, i) => ({ from: i ? steps[i - 1] : latest, to: n })));
              else play.jump(st);
              latest = st;
              live = !!ctx?.live;
            }, { immediate: true });
            Vue.onUnmounted(play.stop);
            const f = play.frame;
            const line = Vue.computed(() => {
              const st = f.value?.state;
              if (!st) return '';
              if (st.tanks) return [`第 ${st.t} 步`, `动作 ${ACT[st.acts[0]] ?? st.acts[0]}`, `机器人 ${ACT[st.acts[1]] ?? st.acts[1]}`, DUEL_END[st.end] ?? ''].filter(Boolean).join(' · ');
              return [`第 ${st.t} 步`, `动作 ${ACT[st.act] ?? st.act}`, `击毁 ${st.kills}`, st.killed ? `本步击毁 ${st.killed}` : '', END[st.end] ?? ''].filter(Boolean).join(' · ');
            });
            return { CELL, s, f, line, ME, FOE, BRICK };
          },
          template: `
            <div v-if="!s">还没有状态</div>
            <div v-else-if="!f">状态里没有地图 cells</div>
            <div v-else>
              <svg :viewBox="'-1 -1 ' + (f.N * CELL + 2) + ' ' + (f.N * CELL + 2)" width="100%" style="display: block" role="group"
                :aria-label="f.N + '×' + f.N + ' 地图，' + f.bricks.length + ' 格砖墙，' + f.steel.length + ' 格钢墙'">
                <rect :width="f.N * CELL" :height="f.N * CELL" fill="var(--bg)" stroke="var(--line-strong)" stroke-width="1" />
                <g v-for="b in f.bricks" :key="b.key">
                  <rect :x="b.x + 0.5" :y="b.y + 0.5" :width="CELL - 1" :height="CELL - 1" :fill="BRICK" />
                  <path :d="'M' + b.x + ' ' + (b.y + CELL / 2) + 'h' + CELL + 'M' + (b.x + CELL / 2) + ' ' + b.y + 'v' + (CELL / 2) + 'M' + (b.x + CELL / 4) + ' ' + (b.y + CELL / 2) + 'v' + (CELL / 2)"
                    stroke="var(--bg)" stroke-width="1" />
                </g>
                <g v-for="b in f.steel" :key="b.key">
                  <rect :x="b.x + 0.5" :y="b.y + 0.5" :width="CELL - 1" :height="CELL - 1" fill="var(--muted)" />
                  <rect :x="b.x + 5" :y="b.y + 5" :width="CELL - 10" :height="CELL - 10" fill="var(--ink)" opacity="0.5" />
                </g>
                <g v-for="b in f.bases" :key="b.key" role="img" :aria-label="b.label" :transform="'translate(' + (b.x + CELL / 2) + ' ' + (b.y + CELL / 2) + ')'">
                  <polygon points="0,-8 2.4,-2.5 8,-2.5 3.5,1.2 5.2,7 0,3.6 -5.2,7 -3.5,1.2 -8,-2.5 -2.4,-2.5" :fill="b.lost ? 'var(--muted)' : b.color" />
                  <path v-if="b.lost" d="M-8 -8L8 8M8 -8L-8 8" stroke="var(--bad)" stroke-width="2" />
                </g>
                <g v-for="t in f.tanks" :key="t.key" :transform="t.transform" role="img" :aria-label="t.label" :opacity="t.hit ? 0.4 : 1">
                  <rect x="-7" y="-7" width="14" height="14" rx="2" :fill="t.color" />
                  <polygon points="0,-10 -4,-3 4,-3" fill="var(--ink)" />
                  <path v-if="t.hit" d="M-8 -8L8 8M8 -8L-8 8" stroke="var(--ink)" stroke-width="2" />
                </g>
                <circle v-for="b in f.shots" :key="b.key" :cx="b.cx" :cy="b.cy" r="3" :fill="b.color" stroke="var(--ink)" role="img" :aria-label="b.label" />
                <g v-for="e in f.effects" :key="e.key" :transform="e.transform" :opacity="e.opacity" aria-hidden="true">
                  <g v-if="e.kind === 'brick'" :fill="BRICK"><rect x="-7" y="-7" width="5" height="5" /><rect x="2" y="-6" width="5" height="4" /><rect x="-6" y="2" width="4" height="5" /><rect x="3" y="3" width="4" height="4" /></g>
                  <path v-else-if="e.kind === 'spark'" d="M-6 0H6M0 -6V6M-4 -4L4 4M4 -4L-4 4" stroke="var(--spike, #f2bc4a)" stroke-width="1.5" />
                  <g v-else-if="e.kind === 'boom'"><circle r="9" fill="var(--bad, #f0684d)" /><circle r="5" fill="var(--spike, #f2bc4a)" /></g>
                  <circle v-else r="5" fill="var(--ink)" />
                </g>
              </svg>
              <div style="margin-top: 4px; font-size: 12px; overflow-wrap: anywhere">
                <span :style="{ color: ME, marginRight: '8px' }">■ 我方</span><span :style="{ color: FOE, marginRight: '8px' }">■ 敌人</span>{{ line }}
              </div>
            </div>`,
        };
  s1_b_loop: { kind: loop, title: 回路（大） }
  s1_b_net:
    kind: network
    title: 大
    config: &big { engine: dense-policy, kind: feedforward, inputs: 492, weightBits: 16, layers: [{ hidden: 128 }, { hidden: 128 }, { hidden: 128 }], ticks: 1, leak_shift: 0, reset: 0 }
  s1_b_readout: { kind: readout, title: 读出（大）, config: *readout }
  s1_b_trainer:
    kind: trainer
    title: 训练器（大）
    config: { method: cross-entropy, epochs: 1500, lr: 0.003, replicas: 1, episodesPerEpoch: 8, calibrationEpisodes: 32, exploration: 0.1, evalEvery: 20, seed: 1, backend: browser }
  s1_b_cands: { kind: candidates, title: 候选（大） }
  s1_b_evaluator: { kind: evaluator, title: 评估器（大） }
  s1_b_report: { kind: view, title: 评估报告（大）, config: *report }
  s1_b_execution: { kind: execution, title: 执行实例（大） }
