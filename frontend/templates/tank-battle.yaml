# 每个训练模块训练一个网络：阶段 1 和阶段 2 各有“中”和“大”两个带槽位的组合，每个组合有一个训练器和一个回路框。
# 它们外面的模块是共用的：参数、对战训练参数、随机数、种子分区、场景和 8 个指标。
# 阶段 2 的 init 和 gate 连线从阶段 1 同一个结构的候选和评估器来，它们是预期的连线，不是槽位。
groups:
  s1_a_box: { title: 回路（中）, loop: s1_a_loop, members: [s1_a_loop, s1_a_net, s1_a_readout] }
  s1_b_box: { title: 回路（大）, loop: s1_b_loop, members: [s1_b_loop, s1_b_net, s1_b_readout] }
  s1_a:
    title: 阶段 1 · 模仿（中）
    members: [s1_a_box, s1_a_trainer, s1_a_cands, s1_a_evaluator, s1_a_report, s1_a_execution, s1_a_replay]
    expose: [s1_a_cands.artifact]
    slots:
      - { id: scenario, title: 场景, port: s1_a_loop.scenario, create: [{ kind: code, title: 场景, ports: { module: scenario } }] }
      - id: training
        title: 训练集
        port: s1_a_trainer.training
        create: [{ kind: partition, title: 分区, ports: { training: training, validation: validation } }]
      - { id: validation, title: 验证集, port: s1_a_trainer.validation }
      - { id: objective, title: 目标, port: s1_a_trainer.objective, create: [{ kind: code, title: 目标位 }] }
  s1_b:
    title: 阶段 1 · 模仿（大）
    members: [s1_b_box, s1_b_trainer, s1_b_cands, s1_b_evaluator, s1_b_report, s1_b_execution, s1_b_replay]
    expose: [s1_b_cands.artifact]
    slots:
      - { id: scenario, title: 场景, port: s1_b_loop.scenario, create: [{ kind: code, title: 场景, ports: { module: scenario } }] }
      - id: training
        title: 训练集
        port: s1_b_trainer.training
        create: [{ kind: partition, title: 分区, ports: { training: training, validation: validation } }]
      - { id: validation, title: 验证集, port: s1_b_trainer.validation }
      - { id: objective, title: 目标, port: s1_b_trainer.objective, create: [{ kind: code, title: 目标位 }] }
  s2_a_box: { title: 回路（中，阶段 2）, loop: s2_a_loop, members: [s2_a_loop, s2_a_net, s2_a_readout] }
  s2_b_box: { title: 回路（大，阶段 2）, loop: s2_b_loop, members: [s2_b_loop, s2_b_net, s2_b_readout] }
  s2_a:
    title: 阶段 2 · 对战训练（中）
    members: [s2_a_box, s2_a_trainer, s2_a_cands, s2_a_evaluator, s2_a_report, s2_a_execution, s2_a_replay]
    expose: [s2_a_cands.artifact]
    slots:
      - { id: scenario, title: 场景, port: s2_a_loop.scenario, create: [{ kind: code, title: 场景, ports: { module: scenario } }] }
      - id: training
        title: 训练集
        port: s2_a_trainer.training
        create: [{ kind: partition, title: 分区, ports: { training: training, validation: validation } }]
      - { id: validation, title: 验证集, port: s2_a_trainer.validation }
      - { id: objective, title: 奖励, port: s2_a_trainer.objective, create: [{ kind: code, title: 奖励 }] }
  s2_b:
    title: 阶段 2 · 对战训练（大）
    members: [s2_b_box, s2_b_trainer, s2_b_cands, s2_b_evaluator, s2_b_report, s2_b_execution, s2_b_replay]
    expose: [s2_b_cands.artifact]
    slots:
      - { id: scenario, title: 场景, port: s2_b_loop.scenario, create: [{ kind: code, title: 场景, ports: { module: scenario } }] }
      - id: training
        title: 训练集
        port: s2_b_trainer.training
        create: [{ kind: partition, title: 分区, ports: { training: training, validation: validation } }]
      - { id: validation, title: 验证集, port: s2_b_trainer.validation }
      - { id: objective, title: 奖励, port: s2_b_trainer.objective, create: [{ kind: code, title: 奖励 }] }
expose: [s2_a_cands.artifact, s2_b_cands.artifact]
