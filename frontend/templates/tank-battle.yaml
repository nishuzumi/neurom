  # 阶段 2 · 对战训练：训练器用 REINFORCE 在对战地图上和机器人（场景的 bot）对战。网络是第 0 方，机器人是第 1 方。
  # 回路的 roles 让它调用场景的 duelInit、duelInput 和 duelStep，而不是关卡的 init、input 和 step（ADR 0022）。
  # 规则（duelStep）：打掉机器人的基地才算赢。我方坦克被击中、我方基地被毁或者走满步数都算输，没有平局。机器人的坦克被击中时
  # 从场上消失，回合继续。奖励是场景的 duelReward：赢 1，输 −1，击毁坦克 0.3，每步减一点。参数在“对战训练参数”里。
  # 每个训练器的 init 接阶段 1 同一结构的候选 weights。gate 接阶段 1 同一结构的评估器报告：和教师一致的比例至少是 0.9 时才能开始。
  # 以前这里还有一个“闯关”阶段（强化学习打关卡），这个阶段从它的权重开始。实测里那样反而更差（“中”0.66，“大”0.47），所以删掉了。
  # 配置是按实测选的（训练器种子 1，200 个测试种子）：2400 轮，从阶段 1 开始时，对机器人的胜率“中”0.72，“大”0.65。
  # 本地 id 用前缀 s2_。
  s2_a_loop: { kind: loop, title: 回路（中，阶段 2）, config: &duelLoop { roles: { init: duelInit, input: duelInput, step: duelStep } } }
  s2_a_net: { kind: network, title: 中（阶段 2）, config: *mid }
  s2_a_readout: { kind: readout, title: 读出（中，阶段 2）, config: *readout }
  s2_a_trainer:
    kind: trainer
    title: 训练器（中，阶段 2）
    config: &duelTrainer
      { method: reinforce, epochs: 2400, lr: 0.002, entropy: 0.01, gamma: 1, replicas: 1, episodesPerEpoch: 32, evalEvery: 10, seed: 1, backend: browser,
        gate: { metric: 和教师一致的比例, min: 0.9 } }
  s2_a_cands: { kind: candidates, title: 候选（中，阶段 2） }
  s2_a_evaluator: { kind: evaluator, title: 评估器（中，阶段 2） }
  s2_a_report: { kind: view, title: 评估报告（中，阶段 2）, config: *report }
  s2_a_execution: { kind: execution, title: 执行实例（中，阶段 2） }
  s2_a_replay: { kind: view, title: 回放（中，阶段 2）, config: *replay }
  s2_b_loop: { kind: loop, title: 回路（大，阶段 2）, config: *duelLoop }
  s2_b_net: { kind: network, title: 大（阶段 2）, config: *big }
  s2_b_readout: { kind: readout, title: 读出（大，阶段 2）, config: *readout }
  s2_b_trainer: { kind: trainer, title: 训练器（大，阶段 2）, config: *duelTrainer }
  s2_b_cands: { kind: candidates, title: 候选（大，阶段 2） }
  s2_b_evaluator: { kind: evaluator, title: 评估器（大，阶段 2） }
  s2_b_report: { kind: view, title: 评估报告（大，阶段 2）, config: *report }
  s2_b_execution: { kind: execution, title: 执行实例（大，阶段 2） }
  s2_b_replay: { kind: view, title: 回放（大，阶段 2）, config: *replay }
  # 对战：两个冻结的网络，结构和“中”“大”相同，权重是阶段 2 的候选里接受的产物。训练器正在训练的网络不能被调用，所以对战用
  # 单独的网络模块。脚本模块“坦克对战”通过函数输入调用它们的读出 run，以及场景的 battle、view 和 play。脚本里没有规则。
  # 本地 id 用前缀 vs_，所以它们排在阶段 2 后面。
  vs_battle:
    kind: script
    title: 坦克对战
    config:
      functions: [红方, 蓝方, battle, view, play]
      inputs: []
      files:
        - name: main.js
          source: |-
            // 坦克对战：两个网络在「场景」的对战地图上打一局。红方是第 0 方（基地在底部），蓝方是第 1 方（基地在顶部）。
            // 一局的流程在 game.js 里，3 个视图在 views.js 里。每次“重置”开始新的一局，种子就是局号，所以结果可以重复。
            // 随机动作概率是 game.js 里的 RANDOM。交换红方和蓝方的连线，两个网络就交换位置。
            import { fight, RANDOM } from './game.js';
            import { Board, Side, Log } from './views.js';

            /** 第几局。 */
            let game = 0;

            export default {
              // 战场在左上，侧栏在右上，日志占满下面一行。侧栏最宽 200px，窄时最多占 45%。
              layout: {
                columns: 'minmax(0, 1fr) minmax(0, min(200px, 45%))',
                rows: 'minmax(0, 1fr) minmax(0, 30%)',
                areas: ['board side', 'log log'],
              },
              views: { board: Board, side: Side, log: Log },
              async main(ctx) {
                game += 1;
                const s = ctx.state;
                Object.assign(s, { game, seed: game, random: RANDOM, now: null, log: [] });
                await fight(ctx.call, {
                  seed: game,
                  random: RANDOM,
                  frame: ctx.frame,
                  show: (now, entry) => {
                    s.now = now;
                    if (entry) s.log.push(entry);
                  },
                });
              },
            };
        - name: game.js
          source: |-
            // 一局对战的流程。它只调用函数输入：场景的 battle、view 和 play，以及红方和蓝方的网络。规则都在场景里。
            // 每一步：先用 view 算出每一方看到的位，再调用这一方的网络，把 one-hot 位换成动作（读出的 map 是 0 到 5）。
            // 然后按随机动作概率，这一方可能改做一个随机动作。最后用 play 让双方同时行动。
            // 每一方的动作按它自己看到的地图（第 1 方看到的转 180°），play 把它换成世界的方向。

            /** 随机动作概率：每一步，每一方按这个概率改做一个随机动作。 */
            export const RANDOM = 0.1;
            /** 函数输入的名字：第 0 方是红方，第 1 方是蓝方。 */
            export const SIDES = ['红方', '蓝方'];

            /** 从 seed 开始的随机数序列（mulberry32），每个数在 [0, 1) 里。同一个 seed 给出同一个序列。 */
            export function stream(seed) {
              let a = seed >>> 0;
              return () => {
                a = (a + 0x6d2b79f5) >>> 0;
                let t = Math.imul(a ^ (a >>> 15), a | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }

            /**
             * 打一局，返回 { state, log }：最后的状态和每一步的记录。
             * call 是函数输入（ctx.call）。seed 决定出发格和随机动作。random 是随机动作概率。
             * 每一轮开头等 frame()。开始时和每一步以后调用 show(state, entry)，开始时 entry 是 null。
             * entry：t 步数，moves 每一方按自己的地图做的动作，wild 每一方的动作是不是随机的，acts 世界方向的动作，end 结果。
             */
            export async function fight(call, { seed, random = RANDOM, frame = async () => {}, show = () => {} }) {
              const draw = stream(seed);
              const log = [];
              let state = await call.battle({ seed });
              show(state, null);
              while (state.end < 0) {
                await frame();
                const moves = [];
                const wild = [];
                for (const [side, name] of SIDES.entries()) {
                  const chosen = (await call[name](await call.view(state, side))).indexOf(1);
                  const u = draw();
                  const v = draw();
                  wild.push(u < random);
                  moves.push(u < random ? Math.floor(v * 6) : chosen);
                }
                state = await call.play(state, moves[0], moves[1]);
                const entry = { t: state.t, moves, wild, acts: state.acts, end: state.end };
                log.push(entry);
                show(state, entry);
              }
              return { state, log };
            }
        - name: views.js
          source: |-
            // 坦克对战的 3 个视图。它们只画 main 写的 state，不改它。侧栏还把 run 交给 Controls。state 包括：
            //   game、seed  第几局和它的种子
            //   random      随机动作概率
            //   now         场景的对战状态：t、cells、tanks、shots、trails、bases、acts、end
            //   log         每一步的记录（见 game.js 的 fight）
            // 战场的画法和训练模块的回放视图相同：砖墙、钢墙、基地，坦克是方块加指向朝向的三角形，子弹是圆点。
            // 战场也和回放一样播每一步的动画（见下面的动画）。侧栏和日志直接显示最新的一步，所以战场落后时它们走在前面。
            import { Controls } from '@ui';
            import { SIDES } from './game.js';

            /** 一格的边长（SVG 单位）。 */
            const CELL = 20;
            const COLOR = ['var(--bad, #f0684d)', 'var(--inh, #5e8fe8)'];
            const BRICK = 'var(--brick, #b4643c)';
            const DIR = ['上', '右', '下', '左'];
            const ACT = [...DIR, '开火', '等待'];
            const MUTED = 'color: var(--muted); font-size: 11px';
            const CARD = 'border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 0; line-height: 1.6';
            const ROW = 'display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px; min-width: 0';
            /** 日志的表头：滚动时留在顶上 */
            const TH = 'position: sticky; top: 0; background: var(--bg); box-shadow: inset 0 -1px var(--line-strong); font-weight: 500; text-align: left; padding-bottom: 2px';

            /** 结果的文字和颜色。now 是对战状态。 */
            function outcome(now) {
              if (!now || now.end < 0) return { text: '进行中', color: 'var(--ink)' };
              const why = SIDES.flatMap((name, k) => [...(now.tanks[k].on ? [] : [`${name}坦克被击中`]), ...(now.bases[k] ? [] : [`${name}基地被毁`])]);
              const text = now.end === 2 ? '平局' : `${SIDES[now.end]}赢`;
              return { text, why: why.length ? why.join('，') : '步数用完', color: COLOR[now.end] ?? 'var(--ink)' };
            }

            // 动画（训练模块的回放视图有同样的一段）：新的一步到达时，从上一帧播到这一帧。场景的 trails 给出每颗子弹的轨迹：
            // 出发格、方向、飞过的格数、最后到的格和停下的原因。子弹每步匀速飞 2 格。坦克按规则先行动，所以在前半步滑一格并转向。
            // 砖墙在子弹打到它时才消失。子弹停下的地方有一个短的效果：砖墙碎掉、钢墙上的火花、坦克或基地爆炸、两颗子弹相撞的闪光。
            // 一步的时长是最近几步到达间隔的平均，限制在 MIN 到 MAX 毫秒。间隔大于 MAX（例如单步）时，时长是 SINGLE。
            // 上一步还没有播完时新的一步到达，上一步在 FAST 毫秒内播完，然后播新的一步。所以显示会落后，但不跳过子弹。
            const MIN = 80;
            const MAX = 600;
            const SINGLE = 200;
            const FAST = 40;
            /** 时长取最近几个到达间隔的平均。 */
            const AVERAGE = 4;
            /** 一个效果持续的毫秒数。 */
            const LIFE = 300;
            const DX = [0, 1, 0, -1];
            const DY = [-1, 0, 1, 0];
            /** 停下的原因（轨迹的 why）的效果：1 砖墙碎掉，2 钢墙或地图边的火花，3 基地和 4 坦克爆炸，5 和 6 两颗子弹相撞的闪光。 */
            const EFFECT = [null, 'brick', 'spark', 'boom', 'boom', 'flash', 'flash'];

            /** 轨迹 r 的子弹停下时离出发格中心几格：打到墙、基地或互相穿过时停在两格的交界，打到坦克或在同一格相撞时停在格的中心。 */
            function reach(r) {
              return r.why === 1 || r.why === 2 || r.why === 3 || r.why === 6 ? r.n - 0.5 : r.n;
            }
            /** 轨迹 r 在一步里停下的时刻（0 到 1）。没有飞就被击中（n 是 0）时，是坦克开到子弹上，所以是坦克走完的半步。 */
            function when(r) {
              return r.why === 4 && r.n === 0 ? 0.5 : reach(r) / 2;
            }
            /** 轨迹 r 的子弹飞了 dist 格时的位置（格的坐标）。 */
            function along(r, dist) {
              return { x: r.x + DX[r.d] * dist, y: r.y + DY[r.d] * dist };
            }
            /** trails 里因为原因 why 停在 (x, y) 的最早时刻。没有这样的轨迹时是 Infinity。 */
            function hitAt(trails, why, x, y) {
              return Math.min(Infinity, ...trails.filter((r) => r.on && r.why === why && r.ex === x && r.ey === y).map(when));
            }
            /** 坦克在时刻 p 的位置和角度：前半步从 a 滑到 b，并朝近的一边转到 b 的朝向。 */
            function slide(a, b, p) {
              const q = Math.min(1, p * 2);
              const turn = ((b.d - a.d + 6) % 4) - 2;
              return { x: a.x + (b.x - a.x) * q, y: a.y + (b.y - a.y) * q, angle: (a.d + turn * q) * 90 };
            }
            /** 一个效果的 SVG 属性：age 从 0 到 1 时，它变大并淡出。 */
            function effect(e) {
              return { key: e.key, kind: e.kind, opacity: 1 - e.age, transform: `translate(${(e.x + 0.5) * CELL} ${(e.y + 0.5) * CELL}) scale(${0.6 + e.age})` };
            }
            /**
             * 播放器。play(steps) 排上新到达的几步（每步是 { from, to } 两个状态），jump(s) 不播动画，直接显示状态 s。
             * draw(from, to, p, effects) 是视图的画法，它画出时刻 p 的样子。播放器把结果放在 frame 里。
             */
            function player(draw) {
              const frame = Vue.shallowRef(null);
              const gaps = [];
              let last = -Infinity;
              let queue = [];
              let cur = null;
              let shown = null;
              let effects = [];
              let raf = 0;
              let serial = 0;
              /** 上一步播完的时刻。一步从它到达的时刻或者上一步播完的时刻开始（取晚的），所以画面的延迟不会累积。 */
              let free = -Infinity;
              /** count 步在时刻 now 一起到达时，每步的时长。 */
              function measure(now, count) {
                const gap = (now - last) / count;
                last = now;
                if (gap > MAX) {
                  gaps.length = 0;
                  return SINGLE;
                }
                gaps.push(gap);
                if (gaps.length > AVERAGE) gaps.shift();
                return Math.min(MAX, Math.max(MIN, gaps.reduce((a, b) => a + b, 0) / gaps.length));
              }
              /** 后面有步在等时，一步最多播几毫秒。等的步很多时，一步只播一帧。 */
              const hurry = () => (queue.length > 8 ? 16 : FAST);
              const progress = (now) => Math.min(1, cur.p0 + (1 - cur.p0) * Math.max(0, (now - cur.t0) / cur.span));
              const aged = (now) => effects.map((e) => effect({ ...e, age: (now - e.born) / LIFE }));
              function tick() {
                raf = 0;
                const now = performance.now();
                if (!cur && queue.length) {
                  const next = queue.shift();
                  cur = { ...next, p0: 0, t0: Math.max(next.at, free), span: queue.length ? hurry() : next.span, ended: [] };
                }
                effects = effects.filter((e) => now - e.born < LIFE);
                if (cur) {
                  const step = cur;
                  const p = progress(now);
                  (step.to.trails ?? []).forEach((r, j) => {
                    if (r.on && r.why > 0 && !step.ended[j] && when(r) <= p) {
                      step.ended[j] = true;
                      effects.push({ key: serial++, kind: EFFECT[r.why], ...along(r, reach(r)), born: now });
                    }
                  });
                  if (p >= 1) {
                    shown = step.to;
                    free = step.t0 + step.span;
                    cur = null;
                  }
                  frame.value = draw(step.from, step.to, p, aged(now));
                } else if (shown) frame.value = draw(shown, shown, 1, aged(now));
                if (cur || queue.length || effects.length) raf = requestAnimationFrame(tick);
              }
              function play(steps) {
                const now = performance.now();
                const span = measure(now, steps.length);
                queue.push(...steps.map((s) => ({ ...s, span, at: now })));
                if (cur && cur.t0 + cur.span - now > hurry()) Object.assign(cur, { p0: progress(now), t0: now, span: hurry() });
                if (!raf) raf = requestAnimationFrame(tick);
              }
              function jump(s) {
                queue = [];
                cur = null;
                effects = [];
                shown = s;
                frame.value = s ? draw(s, s, 1, []) : null;
              }
              return { frame, play, jump, stop: () => cancelAnimationFrame(raf) };
            }

            /** 对战在时刻 p 的样子：从状态 from 播到状态 to。 */
            function draw(from, to, p, effects) {
              const N = Math.round(Math.sqrt(to.cells.length));
              const trails = to.trails ?? [];
              // 被子弹打掉的砖墙画到子弹打到它的时刻
              const cells = to.cells.flatMap((v, c) => {
                const x = c % N;
                const y = Math.floor(c / N);
                const kind = from.cells[c] === 1 && v !== 1 && p < hitAt(trails, 1, x, y) ? 1 : v;
                return kind ? [{ key: c, v: kind, cx: x, cy: y, x: x * CELL, y: y * CELL }] : [];
              });
              // 第 0 方的基地在下半张，第 1 方的在上半张。基地在子弹打到它时被毁。
              const bases = cells.filter((c) => c.v === 3).map((b) => {
                const k = b.cy * 2 < N ? 1 : 0;
                const lost = !to.bases[k] && (!from.bases[k] || p >= hitAt(trails, 3, b.cx, b.cy));
                return { ...b, color: COLOR[k], lost, label: `${SIDES[k]}基地${lost ? '（已被毁）' : ''}` };
              });
              // 坦克在子弹打到它时被击中
              const tanks = to.tanks.map((t, k) => {
                const at = slide(from.tanks[k], t, p);
                const hit = !t.on && (!from.tanks[k].on || p >= hitAt(trails, 4, t.x, t.y));
                return { key: k, color: COLOR[k], hit, transform: `translate(${(at.x + 0.5) * CELL} ${(at.y + 0.5) * CELL}) rotate(${at.angle})`,
                  label: `${SIDES[k]}坦克 (${t.x}, ${t.y}) 朝${DIR[t.d]}${hit ? '，被击中' : ''}` };
              });
              const shots = trails.flatMap((r, k) => {
                if (!r.on || (r.why > 0 && p >= when(r))) return [];
                const at = along(r, Math.min(p * 2, reach(r)));
                return [{ key: k, color: COLOR[k], cx: (at.x + 0.5) * CELL, cy: (at.y + 0.5) * CELL, label: `${SIDES[k]}子弹，从 (${r.x}, ${r.y}) 向${DIR[r.d]}` }];
              });
              return { N, bricks: cells.filter((c) => c.v === 1), steel: cells.filter((c) => c.v === 2), bases, tanks, shots, effects };
            }

            /** 战场：地图、两个基地、两辆坦克和飞行中的子弹。地图按视图的大小缩放，保持正方形。 */
            export const Board = {
              props: ['state'],
              setup(props) {
                const play = player(draw);
                // 同一局多 1 步时播这一步。新的一局（main 先把 now 设为 null）或者其他变化时，直接跳过去。
                // flush 'sync'：每一次赋值都看到，所以两步在同一个时刻到达时也不跳过。
                Vue.watch(() => props.state.now, (now, old) => {
                  const s = now ? Vue.toRaw(now) : null;
                  const was = old ? Vue.toRaw(old) : null;
                  if (s && was && s.t === was.t + 1) play.play([{ from: was, to: s }]);
                  else play.jump(s);
                }, { immediate: true, flush: 'sync' });
                Vue.onUnmounted(play.stop);
                return { CELL, BRICK, MUTED, f: play.frame };
              },
              template: `
                <svg v-if="f" :viewBox="'-1 -1 ' + (f.N * CELL + 2) + ' ' + (f.N * CELL + 2)" style="display: block; width: 100%; height: 100%"
                  role="group" :aria-label="f.N + '×' + f.N + ' 地图，' + f.bricks.length + ' 格砖墙，' + f.steel.length + ' 格钢墙'">
                  <rect :width="f.N * CELL" :height="f.N * CELL" fill="var(--bg)" stroke="var(--line-strong)" stroke-width="1" />
                  <g v-for="b in f.bricks" :key="b.key">
                    <rect :x="b.x + 0.5" :y="b.y + 0.5" :width="CELL - 1" :height="CELL - 1" :fill="BRICK" />
                    <path :d="'M' + b.x + ' ' + (b.y + CELL / 2) + 'h' + CELL + 'M' + (b.x + CELL / 2) + ' ' + b.y + 'v' + (CELL / 2) + 'M' + (b.x + CELL / 4) + ' ' + (b.y + CELL / 2) + 'v' + (CELL / 2)"
                      stroke="var(--bg)" stroke-width="1" />
                  </g>
                  <g v-for="b in f.steel" :key="b.key">
                    <rect :x="b.x + 0.5" :y="b.y + 0.5" :width="CELL - 1" :height="CELL - 1" fill="var(--muted)" />
                    <rect :x="b.x + 5" :y="b.y + 5" :width="CELL - 10" :height="CELL - 10" fill="var(--ink)" opacity="0.5" />
                  </g>
                  <g v-for="b in f.bases" :key="b.key" role="img" :aria-label="b.label" :transform="'translate(' + (b.x + CELL / 2) + ' ' + (b.y + CELL / 2) + ')'">
                    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.5,1.2 5.2,7 0,3.6 -5.2,7 -3.5,1.2 -8,-2.5 -2.4,-2.5" :fill="b.lost ? 'var(--muted)' : b.color" />
                    <path v-if="b.lost" d="M-8 -8L8 8M8 -8L-8 8" stroke="var(--ink)" stroke-width="2" />
                  </g>
                  <g v-for="t in f.tanks" :key="t.key" :transform="t.transform" role="img" :aria-label="t.label" :opacity="t.hit ? 0.4 : 1">
                    <rect x="-7" y="-7" width="14" height="14" rx="2" :fill="t.color" />
                    <polygon points="0,-10 -4,-3 4,-3" fill="var(--ink)" />
                    <path v-if="t.hit" d="M-8 -8L8 8M8 -8L-8 8" stroke="var(--ink)" stroke-width="2" />
                  </g>
                  <circle v-for="b in f.shots" :key="b.key" :cx="b.cx" :cy="b.cy" r="3" :fill="b.color" stroke="var(--ink)" role="img" :aria-label="b.label" />
                  <g v-for="e in f.effects" :key="e.key" :transform="e.transform" :opacity="e.opacity" aria-hidden="true">
                    <g v-if="e.kind === 'brick'" :fill="BRICK"><rect x="-7" y="-7" width="5" height="5" /><rect x="2" y="-6" width="5" height="4" /><rect x="-6" y="2" width="4" height="5" /><rect x="3" y="3" width="4" height="4" /></g>
                    <path v-else-if="e.kind === 'spark'" d="M-6 0H6M0 -6V6M-4 -4L4 4M4 -4L-4 4" stroke="var(--spike, #f2bc4a)" stroke-width="1.5" />
                    <g v-else-if="e.kind === 'boom'"><circle r="9" fill="var(--bad, #f0684d)" /><circle r="5" fill="var(--spike, #f2bc4a)" /></g>
                    <circle v-else r="5" fill="var(--ink)" />
                  </g>
                </svg>
                <div v-else :style="MUTED">正在调用「场景」的 battle…</div>`,
            };

            /** 侧栏：运行按钮，局号、种子和随机动作概率，结果，以及双方的坦克、子弹和基地。 */
            export const Side = {
              props: ['state', 'run'],
              components: { Controls },
              setup(props) {
                const players = Vue.computed(() => SIDES.map((name, k) => {
                  const now = props.state.now;
                  const t = now?.tanks[k];
                  const b = now?.shots[k];
                  return { name, key: k, color: COLOR[k],
                    base: `${k ? '顶部' : '底部'}的基地${!now ? '' : now.bases[k] ? '还在' : '被毁'}`,
                    tank: !t ? '–' : t.on ? `(${t.x}, ${t.y}) 朝${DIR[t.d]}` : '被击中',
                    shot: b?.on ? `(${b.x}, ${b.y}) 向${DIR[b.d]}` : '没有在飞' };
                }));
                const result = Vue.computed(() => outcome(props.state.now));
                const percent = Vue.computed(() => (props.state.random === undefined ? '–' : `${Math.round(props.state.random * 100)}%`));
                return { CARD, MUTED, ROW, players, result, percent };
              },
              template: `
                <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                  <Controls :run="run" />
                  <div :style="MUTED">第 {{ state.game ?? '–' }} 局 · 种子 {{ state.seed ?? '–' }} · 随机动作 {{ percent }}</div>
                  <div :style="CARD">
                    <div :style="ROW"><span style="color: var(--muted)">结果</span><strong :style="{ color: result.color }">{{ result.text }}</strong></div>
                    <div v-if="result.why" style="font-size: 11px; overflow-wrap: anywhere">{{ result.why }}</div>
                  </div>
                  <div v-for="p in players" :key="p.key" :style="CARD + '; border-left: 3px solid ' + p.color">
                    <div :style="ROW">
                      <span :style="{ color: p.color, fontWeight: 600 }">{{ p.name }}</span>
                      <span :style="MUTED">{{ p.base }}</span>
                    </div>
                    <div :style="ROW + '; font-size: 11px'"><span style="color: var(--muted)">坦克</span><span>{{ p.tank }}</span></div>
                    <div :style="ROW + '; font-size: 11px'"><span style="color: var(--muted)">子弹</span><span>{{ p.shot }}</span></div>
                  </div>
                </div>`,
            };

            /** 日志：每一步双方的动作（世界的方向，和战场一致，* 是随机动作），最后一行是结果。新的一步出现时滚到底部。 */
            export const Log = {
              props: ['state'],
              setup(props) {
                const box = Vue.ref(null);
                const rows = Vue.computed(() => (props.state.log ?? []).map((e) => ({ t: e.t, acts: e.acts.map((a, k) => `${ACT[a] ?? a}${e.wild[k] ? ' *' : ''}`) })));
                const result = Vue.computed(() => (props.state.now?.end >= 0 ? outcome(props.state.now) : null));
                Vue.watch(() => rows.value.length, () => Vue.nextTick(() => { if (box.value) box.value.scrollTop = box.value.scrollHeight; }));
                return { box, rows, result, SIDES, COLOR, MUTED, TH };
              },
              template: `
                <div ref="box" style="height: 100%; overflow: auto; scrollbar-width: thin; font-size: 11px">
                  <table v-if="rows.length" style="width: 100%; border-collapse: collapse; table-layout: fixed">
                    <thead>
                      <tr>
                        <th :style="TH + '; width: 4em; color: var(--muted)'">步</th>
                        <th v-for="(name, k) in SIDES" :key="name" :style="TH + '; color: ' + COLOR[k]">{{ name }}</th>
                      </tr>
                    </thead>
                    <tbody style="font-family: var(--mono)">
                      <tr v-for="r in rows" :key="r.t" style="border-top: 1px solid var(--line)">
                        <td>{{ r.t }}</td><td v-for="(a, k) in r.acts" :key="k">{{ a }}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div v-else :style="MUTED">点“单步”或“运行”开始对战。* 是随机动作。</div>
                  <div v-if="result" style="margin-top: 6px; font-weight: 600; overflow-wrap: anywhere">
                    结果：<span :style="{ color: result.color }">{{ result.text }}</span><span style="font-weight: 400">（{{ result.why }}）</span>
                  </div>
                </div>`,
            };
  vs_mid_net: { kind: network, title: 中（对战）, config: *mid }
  vs_mid_readout: { kind: readout, title: 读出（中，对战）, config: *readout }
  vs_big_net: { kind: network, title: 大（对战）, config: *big }
  vs_big_readout: { kind: readout, title: 读出（大，对战）, config: *readout }
